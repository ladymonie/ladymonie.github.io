<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPH AI Judgment Challenge</title>
<style>
body{font-family:Arial,sans-serif;font-size: 24px;background:#eef3f8;margin:0}
main{max-width:820px;margin:auto;padding:20px}
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
button{display:block;width:100%;margin:10px 0;padding:14px;border-radius:10px;border:2px solid #ccc;font-size:1.2rem;padding: 18px; background:white;cursor:pointer}
button:hover{background:#f7f7f7} button:focus{outline:3px solid #2563eb}
#fb{display:none;padding:16px;border-radius:10px;margin-top:15px}
.next{display:none;width:auto}
.barwrap{background:#ddd;height:10px;border-radius:6px} .bar{height:10px;width:0;background:#2563eb;border-radius:6px}
.good{background:#e8f8ec} .dep{background:#fff6d6} .bad{background:#fde8e8}
</style></head><body><main>
<h1>SPH AI Judgment Challenge</h1>
<p>Apply your course's AI policy to realistic scenarios. Select the best option from the list</p>
<div class="barwrap"><div id="bar" class="bar"></div></div>
<p id="prog"></p>
<section class="card">
<h2 id="title"></h2><p id="text"></p>
<div id="answers"></div>
<div id="fb" tabindex="-1"></div>
<button id="next" class="next">Next Scenario</button>
</section></main>
<script>
//=====================
// TEACHER-EDITABLE CONTENT
//=====================

const SCENARIOS=[{title:'Scenario 1',text:'You upload several peer-reviewed articles into AI and ask it to identify common themes, methodological weaknesses, and gaps in the literature for your ILE or Dissertation literature review.',answer:'Not Appropriate',explanation:'Identifying patterns, evaluating evidence, and synthesizing literature are core scholarly responsibilities.',policy:'You must independently read, evaluate, compare, and synthesize the literature.'},
{title:'Scenario 2',text:'You ask AI to explain the difference between prevalence and incidence because you are having difficulty understanding the concepts.',answer:'Appropriate',explanation:'AI may be used as a supplemental learning resource to explain concepts.',policy:'You remain responsible for understanding and applying the concepts independently.'},
{title:'Scenario 3',text:'You write a paragraph for your ILE or Dissertation and ask AI to rewrite it to improve its academic tone, clarity, and flow.',answer:'Not Appropriate',explanation:'Rewriting submitted ILE or Dissertation content goes beyond supplemental assistance and involves transforming your academic work.',policy:'You are responsible for independently writing and revising all ILE or Dissertation content.'},
{title:'Scenario 4',text:'You ask AI to suggest alternative keywords and search terms for a PubMed literature search.',answer:'Appropriate',explanation:'AI may provide technical assistance with identifying potential search terms.',policy:'You must independently conduct the search, screen the results, and determine which sources are relevant.'},
{title:'Scenario 5',text:'You provide AI with your research question and study variables and ask it to recommend an appropriate statistical test.',answer:'Not Appropriate',explanation:'Selecting and justifying statistical methods is a core research competency being assessed in this course.',policy:'You must independently determine and justify your analytical approach.'},
{title:'Scenario 6',text:'You are getting errors in SAS and are havibng trouble interpreting the issue. You provide AI with your SAS code and ask it to explain the error messages or identify possible coding issues.',answer:'Appropriate',explanation:'Limited technical troubleshooting is permitted.',policy:'You must understand and verify all suggested corrections and take responsibility for your code and analysis. Never upload confidential or identifiable data.'},
{title:'Scenario 7',text:'You ask AI to review your research question and specific aims and identify whether they are logically aligned.',answer:'Depends',explanation:'The extent of AI involvement matters. General educational feedback may help you understand alignment, but having AI evaluate or refine your actual ILE or Dissertation aims is a substitute for scholarly judgment.',policy:'You should seek feedback from your ILE or Dissertation advisor or instructor and independently evaluate the alignment of your research question and aims.'},
{title:'Scenario 8',text:'You ask AI to generate potential research questions based on your topic and the published literature.',answer:'Not Appropriate',explanation:'Developing the research question is a central intellectual contribution of the ILE or Dissertation process.',policy:'You must independently identify the research problem, knowledge gap, and research question.'},
{title:'Scenario 9',text:'You ask AI to generate practice questions to help you prepare for your ILE or Dissertation defense.',answer:'Appropriate',explanation:'AI may be used as a supplemental study tool.',policy:'You must independently understand and defend your research decisions.'},
{title:'Scenario 10',text:'You upload your regression output into AI and ask it to interpret the coefficients, confidence intervals, and p-values for your results section.',answer:'Not Appropriate',explanation:'Interpretation of statistical findings is a required component of independent scholarly work.',policy:'You must independently interpret and explain your statistical results.'},
{title:'Scenario 11',text:'You provide AI with your research question, study design, and list of study variables. You ask AI to identify potential confounders and recommend which variables should be included in your statistical analysis. You review the recommendations and decide which ones to use.',answer:'Not Appropriate',explanation:'Identifying, evaluating, and selecting potential confounders requires independent epidemiologic reasoning. Reviewing AI-generated recommendations afterward does not make the methodological decision your own.',policy:'You must independently identify, justify, and defend your confounder selection based on epidemiologic principles and knowledge of your study.'},
{title:'Scenario 12',text:'You upload a CDC report into AI and ask it to summarize the findings so you do not have to read the original report.',answer:'Not Appropriate',explanation:'AI-generated summaries cannot replace direct engagement with primary sources.',policy:'You must read, evaluate, and accurately interpret the original sources you cite.'},
{title:'Scenario 13',text:'You provide AI with your research findings and literature review and ask it to develop an outline identifying the key points, themes, and arguments to include in your ILE or dissertation discussion section. You then write the discussion section yourself using the outline.',answer:'Not Appropriate',explanation:'Developing the structure, identifying key themes, and constructing the scholarly argument are part of the intellectual work required for the ILE or dissertation.',policy:'You must independently organize your findings, synthesize the literature, and develop the arguments presented in your discussion. Seek guidance from your thesis advisor or instructor when needed.'},
{title:'Scenario 14',text:'You ask AI to explain an unfamiliar statistical method, such as propensity score matching, to help you understand how it works.',answer:'Appropriate',explanation:'AI may be used to supplement learning and explain unfamiliar concepts.',policy:'You must independently determine whether the method is appropriate for your research and justify its use.'},
{title:'Scenario 15',text:'You ask AI to generate references, citations, or DOI numbers for your ILE or Dissertation literature review.',answer:'Not Appropriate',explanation:'AI may generate inaccurate, incomplete, or fabricated references.',policy:'You must locate and verify every source independently using authoritative databases.'},
{title:'Scenario 16',text:'You use Grammarly or a similar writing tool to check your ILE or Dissertation for spelling, grammar, and punctuation errors. You review the suggested corrections to ensure they preserve your intended meaning.',answer:'Appropriate',explanation:'Basic proofreading and grammar correction are acceptable when they do not change the substance, meaning, or scholarly content of your writing.',policy:'You may use conventional grammar and spellcheck tools. AI-generated rewriting, paraphrasing, restructuring, or substantive editing of ILE or Dissertation content is not permitted.'},
{title:'Scenario 17',text:'You ask AI to develop a statistical analysis plan using your research question, study design, variables, and proposed hypotheses.',answer:'Not Appropriate',explanation:'Developing and justifying the analytical approach is a central ILE or Dissertation competency.',policy:'You must independently develop and defend your statistical analysis plan.'},
{title:'Scenario 18',text:'You ask AI to quiz you on potential sources of bias, confounding, and effect modification before an upcoming class session.',answer:'Appropriate',explanation:'Practice questions can support independent learning.',policy:'Use AI to strengthen your understanding, not to replace your own critical thinking.'}];

//=====================
const choices=["Appropriate","Depends","Not Appropriate"];
let i=0,score=0;
const t=title,x=text,a=answers,f=fb,b=bar,p=prog,n=next;
function show(){
 let q=SCENARIOS[i];
 t.textContent=q.title;
 x.textContent=q.text;
 p.textContent=`Scenario ${i+1} of ${SCENARIOS.length}`;
 b.style.width=(i/SCENARIOS.length*100)+"%";
 a.innerHTML=""; f.style.display="none"; n.style.display="none";
 choices.forEach(c=>{let bt=document.createElement('button');bt.textContent=c;bt.onclick=()=>check(c);a.appendChild(bt);});
}
function check(c){
 let q=SCENARIOS[i];
 [...a.children].forEach(z=>z.disabled=true);
 if(c===q.answer)score++;
 f.className=q.answer=="Appropriate"?"good":q.answer=="Depends"?"dep":"bad";
 f.innerHTML=`<strong>Best judgment: ${q.answer}</strong><p>${q.explanation}</p><p><strong>Policy connection:</strong> ${q.policy}</p>`;
 f.style.display="block";f.focus();n.style.display="inline-block";
}
n.onclick=()=>{i++;if(i>=SCENARIOS.length){document.querySelector('.card').innerHTML=`<h2>Finished!</h2><p>Your score: <strong>${score}/${SCENARIOS.length}</strong></p><button onclick="location.reload()">Try Again</button>`;b.style.width="100%";p.textContent="Complete";}else show();};
show();
</script></body></html>
